openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /draft-data/schedule:
    get:
      operationId: getNbaSchedule
      tags: [draft-data]
      summary: Complete NBA regular-season schedule for an inclusive matchup date window
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: All dates checked; postponed and canceled games remain explicitly marked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NbaSchedule" }
        "400":
          description: Invalid dates or a window exceeding 14 days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YahooError" }
        "503":
          description: Schedule unavailable or incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YahooError" }
  /draft-data/eligibility:
    get:
      operationId: getDraftEligibility
      tags: [draft-data]
      summary: Standard Yahoo NBA position eligibility from the public Draft Analysis data
      responses:
        "200":
          description: Complete paginated current-season public player eligibility with provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftEligibilityFeed"
        "503":
          description: Yahoo public eligibility unavailable, incomplete or from the wrong season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /draft-data/projections:
    get:
      operationId: getDraftProjections
      tags: [draft-data]
      summary: Public ESPN full-season NBA projections, not historical stats
      responses:
        "200":
          description: Complete validated projection pool with provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftProjectionFeed"
        "503":
          description: Provider unavailable or current-season coverage incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /draft-data/injuries:
    get:
      operationId: getDraftInjuries
      tags: [draft-data]
      summary: Current public ESPN NBA injury reports; absence is not health confirmation
      responses:
        "200":
          description: Dated injury reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftInjuryFeed"
        "503":
          description: Injury provider unavailable or malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /yahoo/status:
    get:
      operationId: getYahooStatus
      tags: [yahoo]
      summary: Direct Yahoo connection and configuration status
      responses:
        "200":
          description: Status for this browser session; no OAuth credentials returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooStatus"
        "503":
          description: Connection storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /yahoo/start:
    post:
      operationId: startYahooAuthorization
      tags: [yahoo]
      summary: Start browser-bound, read-only Yahoo authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YahooConsent"
      responses:
        "200":
          description: Navigate the top-level browser to this Yahoo authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooAuthorization"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "403":
          description: Invalid browser session, origin or CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "429":
          description: Too many authorization attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "503":
          description: Missing configuration or unavailable storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /yahoo/callback:
    get:
      operationId: completeYahooAuthorization
      tags: [yahoo]
      summary: Yahoo OAuth callback; exchanges code on the server
      parameters:
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "302":
          description: Return to app Settings with a safe result code
        "400":
          description: Invalid or expired authorization attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "503":
          description: Missing configuration or unavailable storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /yahoo/connection:
    delete:
      operationId: disconnectYahoo
      tags: [yahoo]
      summary: Delete this browser's saved Yahoo credentials without changing its draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YahooConsent"
      responses:
        "200":
          description: Saved connection removed locally; revoke provider permission in Yahoo if desired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooDisconnected"
        "403":
          description: Invalid browser session, origin or CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "503":
          description: Connection storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /yahoo/leagues:
    get:
      operationId: getYahooLeagues
      tags: [yahoo]
      summary: Verify read access and list this session's NBA leagues
      responses:
        "200":
          description: Yahoo league data, fetched using server-held tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooLeagues"
        "401":
          description: Yahoo connection required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "502":
          description: Yahoo API or token exchange failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
        "503":
          description: Connection storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YahooError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    NbaGame:
      type: object
      required: [id, date, homeTeam, awayTeam, status]
      properties:
        id: { type: string }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        homeTeam: { type: string }
        awayTeam: { type: string }
        status: { type: string, enum: [scheduled, in-progress, final, postponed, canceled] }
    NbaSchedule:
      type: object
      required: [start, end, games, fetchedAt, source, season]
      properties:
        start: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        end: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        games:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/NbaGame" }
        fetchedAt: { type: string, format: date-time }
        source: { type: string, format: uri }
        season: { type: string }
    DraftEligibilityPlayer:
      type: object
      required: [yahooId, name, positions]
      properties:
        yahooId: { type: string, pattern: '^[0-9]+$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        positions:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, enum: [PG, SG, SF, PF, C] }
    DraftEligibilityFeed:
      type: object
      required: [players, season, gameId, fetchedAt, source]
      properties:
        players:
          type: array
          minItems: 150
          maxItems: 3000
          items: { $ref: "#/components/schemas/DraftEligibilityPlayer" }
        season: { type: string }
        gameId: { type: string, pattern: '^[0-9]+$' }
        fetchedAt: { type: string, format: date-time }
        source: { type: string, format: uri }
    DraftProjectionPlayer:
      type: object
      required: [id, name, team, positions, games, points, rebounds, assists, steals, blocks, threes, turnovers, fgm, fga, ftm, fta]
      properties:
        id: { type: string }
        name: { type: string }
        team: { type: string }
        positions:
          type: array
          items: { type: string, enum: [PG, SG, SF, PF, C] }
        games: { type: number, minimum: 1, maximum: 82 }
        points: { type: number, minimum: 0 }
        rebounds: { type: number, minimum: 0 }
        assists: { type: number, minimum: 0 }
        steals: { type: number, minimum: 0 }
        blocks: { type: number, minimum: 0 }
        threes: { type: number, minimum: 0 }
        turnovers: { type: number, minimum: 0 }
        fgm: { type: number, minimum: 0 }
        fga: { type: number, minimum: 0 }
        ftm: { type: number, minimum: 0 }
        fta: { type: number, minimum: 0 }
        adp: { type: number }
    DraftProjectionFeed:
      type: object
      required: [players, source, skippedPlayers]
      properties:
        players:
          type: array
          items: { $ref: "#/components/schemas/DraftProjectionPlayer" }
        skippedPlayers: { type: integer }
        source:
          type: object
          required: [label, season, provider, positionsPlatform, adpPlatform, fetchedAt, url, isDemo]
          properties:
            label: { type: string }
            season: { type: string }
            provider: { type: string }
            positionsPlatform: { type: string }
            adpPlatform: { type: string }
            fetchedAt: { type: string }
            updatedAt: { type: string }
            url: { type: string }
            isDemo: { type: boolean }
    DraftInjuryReport:
      type: object
      required: [name, status, note, source]
      properties:
        name: { type: string }
        status: { type: string }
        note: { type: string }
        source: { type: string }
        updatedAt: { type: string }
        returnDate: { type: string }
    DraftInjuryFeed:
      type: object
      required: [reports, checkedAt, source]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/DraftInjuryReport" }
        checkedAt: { type: string }
        reportUpdatedAt: { type: string }
        source: { type: string }
    YahooStatus:
      type: object
      required: [configured, connected, missingConfig, redirectUri, connectedAt, csrfToken]
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        missingConfig:
          type: array
          items: { type: string }
        redirectUri: { type: [string, "null"] }
        connectedAt: { type: [string, "null"] }
        csrfToken: { type: [string, "null"] }
    YahooConsent:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 1, maxLength: 200 }
    YahooAuthorization:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string }
    YahooDisconnected:
      type: object
      required: [disconnected]
      properties:
        disconnected: { type: boolean }
    YahooError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }
    YahooLeague:
      type: object
      required: [key, name, season, draftStatus, teamCount, scoringType]
      properties:
        key: { type: string }
        name: { type: string }
        season: { type: string }
        draftStatus: { type: string }
        teamCount: { type: integer }
        scoringType: { type: string }
    YahooLeagues:
      type: object
      required: [leagues, checkedAt]
      properties:
        leagues:
          type: array
          items:
            $ref: "#/components/schemas/YahooLeague"
        checkedAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

